<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>FonoTech - Sistema de Gestão Fonoaudiológica</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container-hub {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .cabecalho-hub {
            text-align: center;
            border-bottom: 2px solid #005f73;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .cabecalho-hub h1 {
            color: #005f73;
            margin: 0 0 10px 0;
            font-size: 28px;
        }

        .cabecalho-hub p {
            color: #666;
            font-size: 15px;
            margin: 0;
        }

        .secao-grid {
            margin-bottom: 30px;
        }

        .secao-grid h2 {
            font-size: 18px;
            color: #2b9348;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .botoes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .botoes-grid a {
            text-decoration: none;
        }

        .botoes-grid button {
            width: 100%;
            padding: 15px;
            background-color: #005f73;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .botoes-grid button:hover {
            background-color: #0a9396;
            transform: translateY(-2px);
        }

        .btn-documento { background-color: #4361ee !important; }
        .btn-documento:hover { background-color: #3a0ca3 !important; }

        .btn-jogo { background-color: #f77f00 !important; }
        .btn-jogo:hover { background-color: #d62828 !important; }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container-hub">
        <!-- CABEÇALHO DO SISTEMA -->
        <div class="cabecalho-hub">
            <h1>FonoTech</h1>
            <p>Sistema Integrado de Gestão e Prática Fonoaudiológica</p>
            <p style="font-size: 13px; color: #005f73; margin-top: 5px;"><strong>Ingrid Cruz</strong> | Fonoaudióloga | CRFa 8-13571</p>
        </div>

        <!-- MÓDULOS CLÍNICOS E ADMINISTRATIVOS -->
        <div class="secao-grid">
            <h2>📁 Módulos Principais e Gestão</h2>
            <div class="botoes-grid">
                <a href="pacientes.html"><button type="button">👥 Prontuário de Pacientes</button></a>
                <a href="avaliacoes.html"><button type="button">📋 Avaliações Clínicas</button></a>
                <a href="planejamento.html"><button type="button">📅 Planejamento Terapêutico</button></a>
                <a href="evolucoes.html"><button type="button">✍️ Evolução Clínica</button></a>
                <a href="documentos.html"><button class="btn-documento" type="button">📄 Central de Documentos</button></a>
                <a href="relatorios.html"><button type="button">📊 Relatórios e Histórico</button></a>
            </div>
        </div>

        <!-- MÓDULOS DE JOGOS E TREINOS ESPECIALIZADOS -->
        <div class="secao-grid">
            <h2>🎮 Jogos e Treinos Especializados</h2>
            <div class="botoes-grid">
                <a href="jogos.html"><button class="btn-jogo" type="button">🎮 Central de Jogos</button></a>
            </div>
        </div>

        <footer>
            <p>FonoTech &copy; 2026 - Todos os direitos reservados. Armazenamento seguro via LocalStorage.</p>
        </footer>
    </div>
</body>
</html>
