<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FonoTech - Sistema Clínico Fonoaudiológico</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container-principal {
            max-width: 950px;
            margin: 0 auto;
            text-align: center;
            padding-bottom: 90px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .btn-menu-principal {
            width: 100%;
            min-height: 100px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            padding: 15px;
            border: none;
            color: white;
            text-decoration: none;
        }

        .btn-menu-principal:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .btn-menu-principal span.icone {
            font-size: 34px;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #005f73;
            color: #ffffff;
            text-align: center;
            padding: 12px 10px;
            font-size: 14px;
            box-shadow: 0 -3px 10px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }

        footer p {
            margin: 0;
            color: #e0f2f1;
            font-weight: 500;
        }

        footer strong {
            color: #ffffff;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="container-principal">
        <h1 style="font-size: 38px; margin-top: 15px; color: #005f73;">🩺 FonoTech</h1>
        <p style="font-size: 18px; color: #555;">Plataforma Clínica de Avaliação, Intervenção e Gestão Fonoaudiológica</p>

        <div class="grid-menu">
            
            <a href="pacientes.html">
                <button class="btn-menu-principal" style="background-color: #005f73;">
                    <span class="icone">👤</span>
                    <span>Cadastro de Pacientes</span>
                </button>
            </a>

            <a href="avaliacoes.html">
                <button class="btn-menu-principal" style="background-color: #0a9396;">
                    <span class="icone">📋</span>
                    <span>Protocolos de Avaliação</span>
                </button>
            </a>

            <a href="planejamento.html">
                <button class="btn-menu-principal" style="background-color: #94d2bd; color: #002930;">
                    <span class="icone">🎯</span>
                    <span>Planejamento Terapêutico</span>
                </button>
            </a>

            <a href="jogos.html">
                <button class="btn-menu-principal" style="background-color: #ee9b00;">
                    <span class="icone">🎮</span>
                    <span>Jogos Terapêuticos</span>
                </button>
            </a>

            <a href="evolucoes.html">
                <button class="btn-menu-principal" style="background-color: #ca6702;">
                    <span class="icone">📝</span>
                    <span>Evolução Clínica</span>
                </button>
            </a>

            <a href="relatorios.html">
                <button class="btn-menu-principal" style="background-color: #bb3e03;">
                    <span class="icone">📊</span>
                    <span>Relatórios Unificados</span>
                </button>
            </a>

            <a href="documentos.html">
                <button class="btn-menu-principal" style="background-color: #2b9348;">
                    <span class="icone">📄</span>
                    <span>Documentos e Declarações</span>
                </button>
            </a>

        </div>
    </div>

    <!-- RODAPÉ FIXO -->
    <footer class="no-print">
        <p><strong>Ingrid Cruz</strong> | Fonoaudióloga | CRFa 8-13571</p>
    </footer>

</body>

</html>
