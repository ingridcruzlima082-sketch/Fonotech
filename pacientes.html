<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro e Gestão de Pacientes - FonoTech</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-cadastro {
            background: #FFFDF9;
            padding: 25px;
            border-radius: 16px;
            border: 1.5px solid #CDD98D;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(88, 28, 35, 0.05);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #581C23;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #CDD98D;
            border-radius: 10px;
            font-family: 'Lora', serif;
            font-size: 14.5px;
            box-sizing: border-box;
            background-color: #FFFDF9;
        }
        .btn-salvar {
            background-color: #F33F0A !important;
            color: white !important;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Lora', serif;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(243, 63, 10, 0.2);
        }
        .btn-salvar:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .tabela-pacientes {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #FFFDF9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(88, 28, 35, 0.05);
        }
        .tabela-pacientes th, .tabela-pacientes td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #CDD98D;
        }
        .tabela-pacientes th {
            background-color: #CDD98D;
            color: #581C23;
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>
    <div class="no-print" style="max-width: 950px; margin: 0 auto 20px auto;">
        <a href="index.html" style="text-decoration: none;"><button type="button" class="btn-voltar-topo">⬅️ Voltar ao Menu Principal</button></a>
    </div>

    <div class="container-hub">
        <div class="cabecalho-hub">
            <h1>👤 Cadastro e Gestão de Pacientes</h1>
            <p>Registo de novos pacientes, dados clínicos e histórico de acompanhamento</p>
        </div>

        <!-- FORMULÁRIO DE NOVO PACIENTE -->
        <div class="form-cadastro">
            <h2 style="margin-top: 0; font-size: 20px; border-bottom: 2px solid #CDD98D; padding-bottom: 8px;">Adicionar Novo Paciente</h2>
            <form id="formPaciente" onsubmit="salvarPaciente(event)">
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Nome Completo do Paciente:</label>
                        <input type="text" id="nome" required placeholder="Digite o nome completo...">
                    </div>
                    <div class="form-group">
                        <label>Data de Nascimento:</label>
                        <input type="date" id="nascimento" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Nome do Responsável (se menor):</label>
                        <input type="text" id="responsavel" placeholder="Nome do responsavel...">
                    </div>
                    <div class="form-group">
                        <label>Contacto / Telefone:</label>
                        <input type="text" id="contacto" placeholder="(00) 00000-0000">
                    </div>
                </div>
                <div class="form-group">
                    <label>Queixa Principal / Observações Clínicas:</label>
                    <textarea id="queixa" rows="3" placeholder="Descreva a queixa principal ou foco terapêutico..."></textarea>
                </div>
                <button type="submit" class="btn-salvar">💾 Guardar Paciente</button>
            </form>
        </div>

        <!-- LISTA DE PACIENTES CADASTRADOS -->
        <div class="secao-grid">
            <h2>Pacientes Registados</h2>
            <div style="overflow-x: auto;">
                <table class="tabela-pacientes">
                    <thead>
                        <tr>
                            <th>Nome do Paciente</th>
                            <th>Responsável</th>
                            <th>Contacto</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaPacientes">
                        <!-- Os pacientes salvos aparecem aqui dinamicamente -->
                    </tbody>
                </table>
            </div>
        </div>

        <footer>
            <p>FonoTech &copy; 2026 - Gestão Prontuário Clínico</p>
        </footer>
    </div>

    <script>
        // Função simples para gerir salvamento via localStorage
        function carregarPacientes() {
            const pacientes = JSON.parse(localStorage.getItem('fonotech_pacientes')) || [];
            const tbody = document.getElementById('listaPacientes');
            tbody.innerHTML = '';
            
            if (pacientes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #713f12; font-style: italic;">Nenhum paciente registado ainda.</td></tr>';
                return;
            }

            pacientes.forEach((p, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: 600;">${p.nome}</td>
                        <td>${p.responsavel || '-'}</td>
                        <td>${p.contacto || '-'}</td>
                        <td>
                            <button onclick="removerPaciente(${index})" style="background: #F33F0A; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: 'Lora', serif; font-size: 13px;">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        function salvarPaciente(event) {
            event.preventDefault();
            const novoPaciente = {
                nome: document.getElementById('nome').value,
                nascimento: document.getElementById('nascimento').value,
                responsavel: document.getElementById('responsavel').value,
                contacto: document.getElementById('contacto').value,
                queixa: document.getElementById('queixa').value
            };

            const pacientes = JSON.parse(localStorage.getItem('fonotech_pacientes')) || [];
            pacientes.push(novoPaciente);
            localStorage.setItem('fonotech_pacientes', JSON.stringify(pacientes));

            document.getElementById('formPaciente').reset();
            carregarPacientes();
        }

        function removerPaciente(index) {
            if (confirm('Deseja realmente remover este paciente?')) {
                const pacientes = JSON.parse(localStorage.getItem('fonotech_pacientes')) || [];
                pacientes.splice(index, 1);
                localStorage.setItem('fonotech_pacientes', JSON.stringify(pacientes));
                carregarPacientes();
            }
        }

        window.onload = carregarPacientes;
    </script>
</body>
</html>
