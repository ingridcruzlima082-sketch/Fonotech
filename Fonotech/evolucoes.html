<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Evolução Clínica - FonoTech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="no-print" style="max-width: 900px; margin: 0 auto 20px auto;">
        <a href="index.html" style="text-decoration: none;"><button type="button" class="btn-voltar-topo">⬅️ Voltar ao Menu Principal</button></a>
    </div>

    <div class="container-hub">
        <div class="cabecalho-hub">
            <h1>📈 Relatório de Evolução Clínica</h1>
            <p>Registo de progresso terapêutico e acompanhamento do paciente</p>
        </div>

        <div class="form-identificacao" style="background: #FFFDF9; padding: 20px; border-radius: 12px; border: 1.5px solid #CDD98D; margin-bottom: 25px;">
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 15px;">
                <div>
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Nome do Paciente:</label>
                    <input type="text" id="nomePaciente" placeholder="Nome completo do paciente..." style="width: 100%; padding: 10px; border: 1px solid #CDD98D; border-radius: 8px; font-family: 'Lora', serif;">
                </div>
                <div>
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Data da Sessão:</label>
                    <input type="date" id="dataSessao" style="width: 100%; padding: 10px; border: 1px solid #CDD98D; border-radius: 8px; font-family: 'Lora', serif;">
                </div>
            </div>
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Objetivos Trabalhados na Sessão:</label>
                <input type="text" id="objetivos" placeholder="Ex: Consciência fonológica, treino de fluência..." style="width: 100%; padding: 10px; border: 1px solid #CDD98D; border-radius: 8px; font-family: 'Lora', serif;">
            </div>
        </div>

        <div class="secao-grid">
            <h2>Registo de Desempenho e Conduta Terapêutica</h2>
            <textarea id="textoEvolucao" placeholder="Descreva detalhadamente o desempenho do paciente, respostas aos estímulos, estratégias utilizadas e considerações clínicas..." style="width: 100%; height: 200px; padding: 15px; border: 1.5px solid #CDD98D; border-radius: 12px; font-family: 'Lora', serif; font-size: 15px; resize: vertical; box-sizing: border-box;"></textarea>
        </div>

        <div style="text-align: center; margin-top: 30px;" class="no-print">
            <button type="button" onclick="window.print()" style="background-color: #F33F0A; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; font-family: 'Lora', serif; box-shadow: 0 4px 12px rgba(243, 63, 10, 0.2);">🖨️ Imprimir / Guardar Relatório</button>
        </div>

        <footer>
            <p>FonoTech &copy; 2026 - Plataforma Clínica Fonoaudiológica</p>
        </footer>
    </div>
</body>
</html>
